services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orders_pipeline
      MYSQL_USER: pipeline_user
      MYSQL_PASSWORD: pipeline_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
